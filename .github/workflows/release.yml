name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Builds and tests with no secrets and a read-only token, so nothing a
  # dependency runs here can reach the signing key or publish anything.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest patched Go, so release builds carry every standard library fix.
          go-version: stable
          check-latest: true
          cache: false
      - run: go test ./...
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/build-release.sh "${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Signs, attests and publishes. The release environment requires an
  # approval and is the only place the signing key exists.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # publish the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/release-key"
          printf '%s\n' "$SIGNING_KEY" >"$key"
          ssh-keygen -Y sign -f "$key" -n empirio-release dist/SHA256SUMS
          rm -f "$key"
          # Check the signature against the key the CLI and installers trust.
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/internal/release/allowed_signers" -o "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I release@empiriolabs.ai -n empirio-release -s dist/SHA256SUMS.sig <dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat >"$RUNNER_TEMP/notes.md" <<NOTES
          Install or update:

          \`\`\`sh
          curl -fsSL https://empiriolabs.ai/install.sh | sh
          \`\`\`

          \`\`\`powershell
          irm https://empiriolabs.ai/install.ps1 | iex
          \`\`\`

          Already installed: \`empirio update\`. \`SHA256SUMS.sig\` is signed by the release key in
          [\`internal/release/allowed_signers\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/internal/release/allowed_signers),
          which \`empirio update\` and the installers check. Verify a download's build provenance with
          \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`.
          NOTES
          # A version with a suffix (0.2.0-rc.1) is a pre-release, which
          # releases/latest, the installers and empirio update never pick.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease --title "empirio ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"

  # Installs the published release the way a customer does, on every platform.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash # with pipefail, so a failed install is not hidden by tee
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh" | EMPIRIO_VERSION="${TAG#v}" sh 2>&1 | tee install.log
          grep -F "Release signature verified." install.log
          "$HOME/.local/bin/empirio" --version | grep -F "${TAG#v}"
          "$HOME/.local/bin/empirio" agents --json >/dev/null
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $env:EMPIRIO_VERSION = $env:TAG.TrimStart('v')
          $log = irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/install.ps1" | iex *>&1 | Out-String
          $log
          if ($log -notmatch 'Release signature verified') { throw 'the signature was not checked' }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\empirio\empirio.exe'
          $out = & $exe --version
          if ($out -notmatch [regex]::Escape($env:EMPIRIO_VERSION)) { throw "unexpected version: $out" }
          & $exe agents --json | Out-Null
