version: 2
updates:
  # Version updates wait until a release is a week old: a poisoned release is
  # usually found and pulled within hours. Security updates are not delayed.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
